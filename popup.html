<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Link Paster Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="glow-bg"></div>
    <div class="app-container">
        
        <!-- Header -->
        <header class="header">
            <div class="logo-container">
                <div class="logo-glow"></div>
                <img src="icon.png" alt="Logo" class="logo-img">
            </div>
            <div class="header-text">
                <h1 class="app-title">X LINK PASTER ENGINE</h1>
                <p class="app-subtitle">AI-Powered Engagement Protocol</p>
            </div>
        </header>

        <!-- Main Controls -->
        <div class="card row-card">
            <div class="status-col">
                <span class="label">Master Switch</span>
                <div class="status-info">
                    <div class="status-indicator" id="status-dot"></div>
                    <span id="status-text">Inactive</span>
                </div>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggle-bot">
                <span class="slider round"></span>
            </label>
        </div>

        <button id="open-dashboard-btn" class="btn-primary" style="margin-bottom: 12px;">Open Automator Dashboard</button>

        <!-- Settings -->
        <div class="card settings-card">
            <div class="form-group">
                <label>Action Mode</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="action-mode" value="like" id="mode-like">
                        <span class="radio-text">Like</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="action-mode" value="comment" id="mode-comment" checked>
                        <span class="radio-text">Comment</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="action-mode" value="both" id="mode-both">
                        <span class="radio-text">Both</span>
                    </label>
                </div>
            </div>

            <div class="row-inputs">
                <div class="form-group small-input">
                    <label for="time-limit">Tab Wait (s)</label>
                    <input type="number" id="time-limit" min="0" max="60" value="3">
                </div>
                <div class="form-group small-input">
                    <label>Read Time (s)</label>
                    <div class="input-row">
                        <input type="number" id="read-min" min="0" max="30" value="3" placeholder="Min">
                        <span>-</span>
                        <input type="number" id="read-max" min="0" max="30" value="7" placeholder="Max">
                    </div>
                </div>
            </div>

            <div class="form-group" style="margin-top: 8px;">
                <label for="api-key">Groq API Key</label>
                <input type="password" id="api-key" placeholder="gsk_...">
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-actions">
            <button id="save-btn" class="btn-primary btn-save">Save Config</button>
            <div id="message"></div>
        </div>
        
    </div>
    <script src="popup.js"></script>
</body>
</html>
