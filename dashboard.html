<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Automator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        
        <header class="header">
            <div class="header-left">
                <div class="logo-container">
                    <img src="icon.png" alt="Logo" class="logo-img">
                </div>
                <div>
                    <h1 class="app-title">X LINK PASTER ENGINE</h1>
                    <p class="app-subtitle">AI-Powered Engagement Protocol</p>
                </div>
            </div>
        </header>
        
        <div class="main-content">
            <div class="input-section glass-panel">
                <div class="section-header">
                    <h2>Data Ingestion</h2>
                    <span class="badge" id="link-count-badge">0 Targets Acquired</span>
                </div>
                <p class="help-text">Input raw data streams below. The engine will automatically filter and extract targeted X URLs.</p>
                
                <textarea id="bulk-input" placeholder="Initialize data stream...
Example:
[8/13/2026] Target: https://x.com/username/status/123456789"></textarea>
                
                <div class="action-row">
                    <button id="extract-btn" class="btn-secondary">Extract URLs</button>
                    <button id="start-btn" class="btn-primary" disabled>Engage Protocol</button>
                    <button id="stop-btn" class="btn-danger" style="display: none;">Abort Mission</button>
                </div>
            </div>

            <div class="status-section glass-panel">
                <div class="section-header">
                    <h2>Operation Queue</h2>
                    <span id="queue-status" class="status-text idle">Standby</span>
                </div>
                
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p class="progress-text" id="progress-text">Awaiting commands...</p>
                
                <div class="link-list" id="link-list">
                    <div class="empty-state">No targets acquired</div>
                </div>
            </div>
        </div>
        
    </div>
    
    <div class="floating-dev-badge">
        <span class="dev-label">Developed by</span>
        <span class="dev-name">Pritom Shihab</span>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
